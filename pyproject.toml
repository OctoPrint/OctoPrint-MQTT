[build-system]
requires = [
    "setuptools>=68",
]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-MQTT"
version = "0.8.18"
description = "An OctoPrint Plugin that adds support for MQTT to OctoPrint."
authors = [
    { name = "Gina HÃ¤uÃŸge", email = "gina@octoprint.org" },
]
requires-python = ">=3.7,<4"
dependencies = [
    "OctoPrint>=1.3.5",
    "six",
    "paho-mqtt>=2,<3",
]
dynamic = [
    "license",
]

[project.entry-points."octoprint.plugin"]
mqtt = "octoprint_mqtt"

[project.urls]
Homepage = "https://github.com/OctoPrint/OctoPrint-MQTT"

[project.optional-dependencies]
develop = [
    "go-task-bin",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "octoprint_mqtt",
    "octoprint_mqtt.*",
]
